interface:
  display_name: "ManDiff"
  short_description: "先讲清原逻辑，再将 Git 改动整理为可追查的审阅指南"
  default_prompt: "Use $mandiff to prepare the selected change, first establish the original architecture, responsibilities, execution flow, and data or state from frozen pre-change context, then explain the change and exact diff. Write semantic review prose in the predominant language of our conversation unless I specify another language, use plain precise direct language without unnecessary or invented terminology, and finalize the portable evidence-complete report with the bundled workflow."
